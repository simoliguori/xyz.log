<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'Roboto Mono','DejaVu Sans Mono',monospace">
  <rect width="820" height="440" fill="#1e1e1e"/>
  <style>
    .t{fill:#dcdcdc} .m{fill:#8f8f96} .acc{fill:#9a99d6}
    .box{fill:#262626;stroke:#3a3a41;stroke-width:1.5;rx:12}
    .core{fill:#23232b;stroke:#44437a;stroke-width:1.5}
  </style>

  <text x="410" y="40" text-anchor="middle" font-size="22" class="t">xyzlog — markdown come fonte di verità</text>
  <text x="410" y="64" text-anchor="middle" font-size="12" class="m">niente database · niente server · dati tuoi</text>

  <!-- markdown store -->
  <rect x="210" y="92" width="400" height="74" rx="12" class="box"/>
  <text x="410" y="120" text-anchor="middle" font-size="13" class="acc">Vault / cartella sincronizzata</text>
  <text x="410" y="146" text-anchor="middle" font-size="13" class="t">Habits.md   ·   Habit Log.md   ·   Todo.md</text>

  <!-- core -->
  <rect x="300" y="196" width="220" height="48" rx="12" class="core"/>
  <text x="410" y="220" text-anchor="middle" font-size="12" class="acc">core condiviso</text>
  <text x="410" y="236" text-anchor="middle" font-size="11" class="m">parser · tipi · renderer · stili</text>

  <!-- connectors -->
  <line x1="410" y1="166" x2="410" y2="196" stroke="#44437a" stroke-width="1.5"/>
  <line x1="150" y1="300" x2="150" y2="340" stroke="#3a3a41" stroke-width="1.5"/>
  <line x1="410" y1="300" x2="410" y2="340" stroke="#3a3a41" stroke-width="1.5"/>
  <line x1="670" y1="300" x2="670" y2="340" stroke="#3a3a41" stroke-width="1.5"/>
  <path d="M410 244 L410 270 L150 270 L150 300" fill="none" stroke="#3a3a41" stroke-width="1.5"/>
  <path d="M410 244 L410 300" fill="none" stroke="#3a3a41" stroke-width="1.5"/>
  <path d="M410 244 L410 270 L670 270 L670 300" fill="none" stroke="#3a3a41" stroke-width="1.5"/>

  <!-- clients -->
  <rect x="40" y="300" width="220" height="100" rx="12" class="box"/>
  <text x="150" y="330" text-anchor="middle" font-size="14" class="t">Plugin Obsidian</text>
  <text x="150" y="352" text-anchor="middle" font-size="11" class="m">TypeScript · fatto</text>
  <text x="150" y="374" text-anchor="middle" font-size="11" class="m">vista + blocchi modulari</text>

  <rect x="300" y="300" width="220" height="100" rx="12" class="box"/>
  <text x="410" y="330" text-anchor="middle" font-size="14" class="t">Widget Android</text>
  <text x="410" y="352" text-anchor="middle" font-size="11" class="m">Kotlin + Glance · fatto</text>
  <text x="410" y="374" text-anchor="middle" font-size="11" class="m">abitudini + todo in home</text>

  <rect x="560" y="300" width="220" height="100" rx="12" class="core"/>
  <text x="670" y="330" text-anchor="middle" font-size="14" class="t">Widget Windows</text>
  <text x="670" y="352" text-anchor="middle" font-size="11" class="acc">Tauri · da costruire</text>
  <text x="670" y="374" text-anchor="middle" font-size="11" class="m">gadget desktop + notifiche</text>
</svg>
