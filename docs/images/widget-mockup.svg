<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="'Roboto Mono','DejaVu Sans Mono',monospace">
  <rect width="820" height="460" fill="#141414"/>
  <style>
    .t{fill:#dcdcdc} .m{fill:#8f8f96} .acc{fill:#9a99d6}
    .panel{fill:#1e1e1e;stroke:#3a3a41;stroke-width:1.5}
    .card{fill:#262626;stroke:#3a3a41;stroke-width:1}
    .dot{fill:#44437a}
  </style>

  <text x="30" y="30" font-size="16" class="t">xyz.log</text>
  <text x="96" y="30" font-size="12" class="m">desktop widget (mockup) — always on the desktop, no taskbar</text>

  <!-- window -->
  <rect x="24" y="48" width="772" height="392" rx="16" class="panel"/>

  <!-- tab bar -->
  <rect x="44" y="68" width="88" height="26" rx="13" class="dot" opacity="0.5"/>
  <text x="88" y="86" text-anchor="middle" font-size="12" class="t">Habits</text>
  <text x="168" y="86" font-size="12" class="m">Tasks</text>
  <text x="232" y="86" font-size="12" class="m">Today</text>

  <!-- left: tasks (tall) -->
  <rect x="44" y="110" width="360" height="310" rx="10" class="card"/>
  <text x="62" y="134" font-size="13" class="acc">Tasks</text>
  <g class="t" font-size="11">
    <circle cx="70" cy="160" r="6" fill="none" stroke="#8f8f96"/><text x="88" y="164">renew passport</text>
    <circle cx="70" cy="186" r="6" fill="none" stroke="#8f8f96"/><text x="88" y="190">call the dentist</text>
    <circle cx="70" cy="212" r="6" fill="none" stroke="#8f8f96"/><text x="88" y="216">weekly groceries</text>
    <circle cx="70" cy="238" r="6" fill="none" stroke="#8f8f96"/><text x="88" y="242">meeting slides</text>
    <circle cx="70" cy="264" r="6" fill="none" stroke="#8f8f96"/><text x="88" y="268">book the trip</text>
    <circle cx="70" cy="290" r="6" fill="none" stroke="#8f8f96"/><text x="88" y="294">read the article</text>
  </g>
  <rect x="396" y="120" width="4" height="60" rx="2" fill="#3a3a41"/>

  <!-- right top: habits -->
  <rect x="420" y="110" width="356" height="150" rx="10" class="card"/>
  <text x="438" y="134" font-size="13" class="acc">Habits</text>
  <g font-size="11" class="t">
    <circle cx="448" cy="162" r="7" fill="#44437a"/><text x="466" y="166">minoxidil</text>
    <circle cx="448" cy="192" r="7" fill="#44437a"/><text x="466" y="196">lamictal 50mg</text>
    <circle cx="448" cy="222" r="7" fill="none" stroke="#8f8f96"/><text x="466" y="226">denti</text>
  </g>
  <g fill="#44437a">
    <rect x="690" y="158" width="7" height="7" rx="2"/><rect x="700" y="158" width="7" height="7" rx="2"/>
    <rect x="710" y="158" width="7" height="7" rx="2" opacity="0.3"/><rect x="720" y="158" width="7" height="7" rx="2"/>
  </g>

  <!-- right bottom: history overview (one line per habit) -->
  <rect x="420" y="270" width="356" height="150" rx="10" class="card"/>
  <text x="438" y="294" font-size="13" class="acc">History</text>
  <g font-size="10" class="m">
    <text x="438" y="316">minoxidil</text><text x="438" y="340">lamictal</text><text x="438" y="364">denti</text>
  </g>
  <g fill="#44437a">
    <g transform="translate(520,310)">
      <rect x="0" y="0" width="7" height="7" rx="2"/><rect x="9" y="0" width="7" height="7" rx="2" opacity="0.4"/><rect x="18" y="0" width="7" height="7" rx="2"/><rect x="27" y="0" width="7" height="7" rx="2"/><rect x="36" y="0" width="7" height="7" rx="2" opacity="0.3"/><rect x="45" y="0" width="7" height="7" rx="2"/><rect x="54" y="0" width="7" height="7" rx="2"/><rect x="63" y="0" width="7" height="7" rx="2" opacity="0.5"/><rect x="72" y="0" width="7" height="7" rx="2"/><rect x="81" y="0" width="7" height="7" rx="2"/><rect x="90" y="0" width="7" height="7" rx="2"/><rect x="99" y="0" width="7" height="7" rx="2" opacity="0.4"/>
    </g>
    <g transform="translate(520,334)">
      <rect x="0" y="0" width="7" height="7" rx="2" opacity="0.3"/><rect x="9" y="0" width="7" height="7" rx="2"/><rect x="18" y="0" width="7" height="7" rx="2"/><rect x="27" y="0" width="7" height="7" rx="2" opacity="0.5"/><rect x="36" y="0" width="7" height="7" rx="2"/><rect x="45" y="0" width="7" height="7" rx="2"/><rect x="54" y="0" width="7" height="7" rx="2" opacity="0.4"/><rect x="63" y="0" width="7" height="7" rx="2"/><rect x="72" y="0" width="7" height="7" rx="2"/><rect x="81" y="0" width="7" height="7" rx="2"/><rect x="90" y="0" width="7" height="7" rx="2" opacity="0.3"/><rect x="99" y="0" width="7" height="7" rx="2"/>
    </g>
    <g transform="translate(520,358)">
      <rect x="0" y="0" width="7" height="7" rx="2"/><rect x="9" y="0" width="7" height="7" rx="2" opacity="0.4"/><rect x="18" y="0" width="7" height="7" rx="2"/><rect x="27" y="0" width="7" height="7" rx="2" opacity="0.6"/><rect x="36" y="0" width="7" height="7" rx="2"/><rect x="45" y="0" width="7" height="7" rx="2"/><rect x="54" y="0" width="7" height="7" rx="2" opacity="0.3"/><rect x="63" y="0" width="7" height="7" rx="2"/><rect x="72" y="0" width="7" height="7" rx="2"/><rect x="81" y="0" width="7" height="7" rx="2"/><rect x="90" y="0" width="7" height="7" rx="2"/><rect x="99" y="0" width="7" height="7" rx="2" opacity="0.5"/>
    </g>
  </g>
</svg>
